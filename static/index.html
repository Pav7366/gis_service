<!DOCTYPE html>
<html>
<head>
  <title>Smart City MVP</title>
  <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    #ui-panel { position: absolute; top: 20px; left: 20px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1; }
  </style>
</head>
<body>
  
  <div id="ui-panel">
    <h3 style="margin: 0 0 10px 0;">Pune Infrastructure</h3>
    <p style="margin: 0; font-size: 13px;"><strong>Legend:</strong><br>
       <span style="color:#d32f2f;">●</span> Pothole (Point)<br>
       <span style="color:#f57c00;">▬</span> Broken Divider (Line)<br>
       <span style="color:#1976d2;">■</span> Large Damage (Polygon)
    </p>
  </div>

  <div id="map"></div>

  <script>
    const deckgl = new deck.DeckGL({
      container: 'map',
      mapStyle: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
      initialViewState: { longitude: 73.8567, latitude: 18.5204, zoom: 14, pitch: 50, bearing: 0 },
      controller: { dragRotate: true, touchRotate: true, dragPan: true, scrollZoom: true, doubleClickZoom: true, touchZoom: true, keyboard: true },
      layers: []
    });

    async function loadData() {
      try {
        const res = await fetch('/api/hazards/');
        const geojsonData = await res.json();
        
        // Using GeoJsonLayer to handle multiple shape types automatically
        const layer = new deck.GeoJsonLayer({
          id: 'hazards-geojson',
          data: geojsonData,
          pickable: true,
          stroked: true,
          filled: true,
          lineWidthScale: 15,
          lineWidthMinPixels: 4,
          getPointRadius: 15,
          pointRadiusMinPixels: 6,
          
          // Color logic based on hazard type
          getFillColor: d => {
            if (d.properties.hazard_type === 'pothole') return [211, 47, 47, 255]; // Red for potholes
            if (d.properties.hazard_type === 'large_damage') return [25, 118, 210, 150]; // Transparent Blue for Polygons
            return [200, 200, 200, 200];
          },
          getLineColor: d => {
            if (d.properties.hazard_type === 'broken_divider') return [245, 124, 0, 255]; // Orange for lines
            return [255, 255, 255]; // White border for polygons
          },
          
          onClick: ({object}) => {
            if (object) alert(`Hazard: ${object.properties.hazard_type.replace('_', ' ').toUpperCase()}`);
          }
        });

        deckgl.setProps({ layers: [layer] });
      } catch (error) {
        console.error("Waiting for data...");
      }
    }

    setInterval(loadData, 3000);
    loadData();
  </script>
</body>
</html>
