<!DOCTYPE html>
<html>
<head>
  <title>Smart City GIS Dashboard</title>
  <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #container { width: 100vw; height: 100vh; position: relative; }
    #panel { position: absolute; top: 15px; left: 15px; background: white; padding: 15px; z-index: 1; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    button { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div id="panel">
    <h3>Live Hazard Dashboard</h3>
    <p>Hazards Detected: <strong id="count">0</strong></p>
    <button id="toggleBtn" onclick="toggleView()">Switch to 3D Heatmap</button>
  </div>
  <div id="container"></div>

  <script>
    let rawData = null;
    let isHeatmapView = false;

    const deckgl = new deck.DeckGL({
      container: 'container',
      mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      initialViewState: { longitude: 73.8567, latitude: 18.5204, zoom: 15, pitch: 45 },
      controller: true,
      layers: []
    });

    async function loadHazards() {
      const response = await fetch('/api/potholes');
      rawData = await response.json();
      
      document.getElementById('count').innerText = rawData.features.length;
      updateLayers();
    }

    function toggleView() {
      isHeatmapView = !isHeatmapView;
      document.getElementById('toggleBtn').innerText = isHeatmapView ? "Switch to Point Markers" : "Switch to 3D Heatmap";
      updateLayers();
    }

    function updateLayers() {
      if (!rawData) return;

      let layer;

      if (isHeatmapView) {
        // 3D Hexagon Density Layer for Municipal Planning
        layer = new deck.HexagonLayer({
          id: 'heatmap-layer',
          data: rawData.features,
          getPosition: d => d.geometry.coordinates,
          radius: 50, // Size of each hexagon grid cell in meters
          elevationScale: 15, // Height multiplier based on density
          extruded: true,
          pickable: true,
          autoHighlight: true,
          colorRange: [
            [254, 240, 217],
            [253, 212, 158],
            [253, 141, 60],
            [227, 26, 28],
            [177, 0, 38]
          ]
        });
      } else {
        // Standard Realistic Road Markers Layer
        layer = new deck.ScatterplotLayer({
          id: 'hazard-layer',
          data: rawData.features,
          getPosition: d => d.geometry.coordinates,
          getFillColor: d => d.properties.severity === 'High' ? [255, 50, 50] : [255, 200, 50],
          radiusUnits: 'meters',
          getRadius: 1.5,
          radiusMinPixels: 4,
          pickable: true,
          autoHighlight: true,
          onClick: ({object}) => alert(`Pothole Detected!\nSeverity: ${object.properties.severity}\nDepth: ${object.properties.depth_cm}cm`)
        });
      }

      deckgl.setProps({ layers: [layer] });
    }

    // Refresh data every 5 seconds
    setInterval(loadHazards, 5000);
    loadHazards();
  </script>
</body>
</html>
